name: netcode offline validation tools
on:
  push:
    branches: [integration/netcode-lobby-upstream]
    paths: [.github/workflows/netcode-build-tools.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure isolated public dependency paths
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/netcode-dotnet" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/netcode-nuget" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore public build dependencies
        run: |
          dotnet restore src/MphRead/MphRead.csproj
          dotnet restore tools/nettest/nettest.csproj
          dotnet restore tools/continuous-phase-check/continuous-phase-check.csproj
      - name: Package isolated SDK and expanded public NuGet packages
        run: |
          tar --exclude='*.nupkg' -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/netcode-build-tools.tar.gz" netcode-dotnet netcode-nuget
          sha256sum "$RUNNER_TEMP/netcode-build-tools.tar.gz"
          split -b 300M "$RUNNER_TEMP/netcode-build-tools.tar.gz" "$RUNNER_TEMP/netcode-tools-part-"
          ls -lh "$RUNNER_TEMP"/netcode-tools-part-*
      - uses: actions/upload-artifact@v7
        with:
          name: netcode-tools-aa
          path: ${{ runner.temp }}/netcode-tools-part-aa
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: netcode-tools-ab
          path: ${{ runner.temp }}/netcode-tools-part-ab
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: netcode-tools-ac
          path: ${{ runner.temp }}/netcode-tools-part-ac
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
