name: netcode offline validation tools
on:
  push:
    branches: [integration/netcode-lobby-upstream]
    paths: [.github/workflows/netcode-build-tools.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure isolated public dependency paths
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/netcode-dotnet" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/netcode-nuget" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore public build dependencies
        run: |
          dotnet restore src/MphRead/MphRead.csproj
          dotnet restore tools/nettest/nettest.csproj
          dotnet restore tools/continuous-phase-check/continuous-phase-check.csproj
      - name: Package isolated SDK and public NuGet packages
        run: |
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/netcode-build-tools.tar.gz" netcode-dotnet netcode-nuget
          sha256sum "$RUNNER_TEMP/netcode-build-tools.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: netcode-build-tools
          path: ${{ runner.temp }}/netcode-build-tools.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
