# Rebuild the macOS assets from a finished release workflow on real Macs.
#
# release.yml historically cross-published both macOS RIDs on Ubuntu. That can
# compile the program, but it cannot produce or validate the code signatures
# macOS enforces, cannot attach the allow-jit entitlement the regular .NET CLR
# needs under hardened runtime, and cannot start the result. This workflow runs
# after the draft release exists and replaces those two assets with binaries
# built, signed and smoke-tested on the processors they target.
#
# workflow_dispatch is also intentional: it lets an existing release be
# repaired in place without creating a new tag.
name: macOS release

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. v0.8.0
        required: true

permissions:
  actions: read
  contents: write

jobs:
  resolve:
    name: resolve release tag
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: find the tag built by release.yml
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            TAG="$INPUT_TAG"
            [[ "$TAG" == v* ]] || TAG="v$TAG"
          else
            # release.yml prints one of these two lines while resolving its
            # tag. Reading the run that triggered *this* workflow avoids any
            # guess based on "latest draft", which is racy when two releases
            # are rebuilt near each other.
            LOG=$(gh run view "$RUN_ID" --repo "$REPO" --log)
            TAG=$(printf '%s\n' "$LOG" | sed -nE \
              -e 's/.*Building the existing tag (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
              -e 's/.*Created (v[0-9]+\.[0-9]+\.[0-9]+) at.*/\1/p' \
              | tail -1)
          fi

          if [ -z "${TAG:-}" ]; then
            echo "::error::Could not determine the release tag from the completed release run."
            exit 1
          fi
          if ! gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG does not exist in $REPO."
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release $TAG does not exist yet; run the release workflow first."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Rebuilding the macOS assets for $TAG."

  macos:
    name: ${{ matrix.rid }} native release
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            arch: arm64
            runner: macos-15
          - rid: osx-x64
            arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: nothing from the game is tracked
        run: tools/check-no-game-assets.sh

      - name: every custom map has the level it converts
        run: tools/check-maps-shipped.sh

      - name: cook the map bundles
        run: dotnet run --project src/MphRead/MphRead.csproj -c Release -- -mapdir maps -mapbundle

      - name: publish on the target processor
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          dotnet publish src/MphRead/MphRead.csproj -c Release -r "$RID" \
            -p:Version="$VERSION" -p:InformationalVersion="$VERSION" \
            --self-contained true -p:PublishSingleFile=true \
            -o "publish/$RID"

      - name: nothing from the game is in the output
        run: tools/check-no-game-assets.sh "publish/${{ matrix.rid }}"

      - name: the custom maps reached the package
        run: tools/check-maps-shipped.sh "publish/${{ matrix.rid }}"

      # A repository with an Apple Developer certificate gets a Developer ID
      # signature and can be notarized below. Forks without those secrets still
      # get a correct ad-hoc signature plus the same hardened-runtime
      # entitlement, which is enough for native CI/local execution after the
      # ordinary quarantine override.
      - name: unlock the Developer ID certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12:-}" ] || [ -z "${CERTIFICATE_PASSWORD:-}" ]; then
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "developer_id=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No macOS Developer ID certificate is configured; the release will be ad-hoc signed and cannot pass Gatekeeper quarantine without a user override."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/fruityprime-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          P12="$RUNNER_TEMP/fruityprime-signing.p12"
          printf '%s' "$CERTIFICATE_P12" | base64 -D > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::The imported certificate does not contain a Developer ID Application identity."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "developer_id=true" >> "$GITHUB_OUTPUT"
          echo "Using $IDENTITY"

      - name: sign and verify every native file
        run: >
          bash tools/macos-sign.sh
          "publish/${{ matrix.rid }}"
          "${{ matrix.arch }}"
          "${{ steps.signing.outputs.identity }}"

      # This catches the exact class of failure from the reported screenshot:
      # the kernel/dyld killing the program before managed Main can get far
      # enough to print an exception. No cartridge data and no display are
      # needed; -credits is handled before the setup check and exits by itself.
      - name: the release executable really starts on macOS
        working-directory: publish/${{ matrix.rid }}
        run: ./FruityPrime -credits >/tmp/fruityprime-macos-smoke.txt

      # Notarization is what removes the normal Gatekeeper warning for a
      # downloaded official release. It is possible only with Developer ID.
      # Missing notary credentials are a warning rather than a build failure so
      # forks can still publish an ad-hoc signed package.
      - name: notarize the Developer ID build
        if: steps.signing.outputs.developer_id == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_APP_PASSWORD:-}" ]; then
            echo "::warning::Developer ID signing succeeded, but APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD are incomplete; skipping notarization."
            exit 0
          fi

          # notarytool accepts a zip container. The ticket is associated with
          # the signed Mach-O code inside it; the public asset remains tar.gz
          # because the desktop updater relies on Unix mode bits from tar.
          NOTARY_ZIP="$RUNNER_TEMP/FruityPrime-$RID-notary.zip"
          ditto -c -k --keepParent "publish/$RID" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          spctl --assess --type execute --verbose=4 "publish/$RID/FruityPrime"

      - name: package the signed build
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          cp LICENSE "publish/$RID/"
          cat > "publish/$RID/README.txt" <<'NOTE'
          Fruity Prime -- Metroid Prime Hunters, on a Mac, with multiplayer.

          Set up with your own Metroid Prime Hunters cartridge dump (.nds).
          It is unpacked next to this program and the file is left alone. No
          game data is included in this download, and none is downloaded.

            ./FruityPrime

          opens the front screen: adventure, play online, play offline against
          bots, host a game, settings, and the game-files setup.

          This package is code-signed for macOS. Official builds also pass
          Apple's notarization step when the release credentials are configured.
          A fork that was only ad-hoc signed may still be blocked by quarantine;
          in that case, after verifying where the archive came from:

            xattr -dr com.apple.quarantine .

          F11 or Alt+Enter switches to fullscreen, Escape opens the pause menu.
          NOTE
          chmod +x "publish/$RID/FruityPrime"
          mkdir -p dist
          ( cd "publish/$RID" && tar czf "../../dist/FruityPrime-$TAG-$RID.tar.gz" . )

      - name: replace the draft release's macOS asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "dist/FruityPrime-$TAG-$RID.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber
